AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS Event Management Local API

# ============================================
# THÊM MỚI: Globals block với Cognito Authorizer
# Áp dụng cho TẤT CẢ API trong template này
# ============================================
Globals:
  Api:
    # ============================================
    # THÊM MỚI: CORS config để xử lý preflight OPTIONS request
    # Bắt buộc phải có khi FE (localhost:5173 hoặc domain khác)
    # gọi API Gateway ở domain execute-api.amazonaws.com
    # ============================================
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"
      # Khi đã có domain FE thật (deploy lên Vercel/Amplify...),
      # nên đổi '*' thành domain cụ thể để bảo mật hơn, ví dụ:
      # AllowOrigin: "'https://your-fe-domain.com'"
    Auth:
      DefaultAuthorizer: CognitoAuthorizer
      AddDefaultAuthorizerToCorsPreflight: false
      Authorizers:
        CognitoAuthorizer:
          UserPoolArn: arn:aws:cognito-idp:ap-southeast-2:133375667858:userpool/ap-southeast-2_oCPOcdOZg
          # Ví dụ: arn:aws:cognito-idp:ap-southeast-2:133375667858:userpool/ap-southeast-2_AbCdEfGhI

Resources:
  EventFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: EventLambda
      CodeUri: src/Functions/EventManagement.EventLambda/
      Handler: EventManagement.EventLambda::EventManagement.EventLambda.Function::FunctionHandler
      Runtime: dotnet8
      MemorySize: 256
      Timeout: 30
      Events:
        GetEvents:
          Type: Api
          Properties:
            Path: /events
            Method: get
            # Auth sẽ tự dùng DefaultAuthorizer (CognitoAuthorizer) từ Globals
            # Nếu route này cần PUBLIC (không cần login), dùng:
            # Auth:
            #   Authorizer: NONE

  UserProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: UserProfileLambda
      CodeUri: src/Functions/EventManagement.UserProfileLambda/
      Handler: EventManagement.UserProfileLambda::EventManagement.UserProfileLambda.Function::FunctionHandler
      Runtime: dotnet8
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:

          USER_TABLE_NAME: EventManagementUsers
          AVATAR_BUCKET_NAME: !Ref EventManagementUserAvatarsBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: EventManagementUsers

        - S3CrudPolicy:
            BucketName: !Ref EventManagementUserAvatarsBucket
      Events:
        InitProfile:
          Type: Api
          Properties:
            Path: /profile/init
            Method: post
            # Tự dùng CognitoAuthorizer từ Globals - bắt buộc phải có JWT hợp lệ
        GetProfile:
          Type: Api
          Properties:
            Path: /profile/me
            Method: get
        # Tự dùng CognitoAuthorizer từ Globals - bắt buộc phải có JWT hợp lệ
        UpdateProfile:
          Type: Api
          Properties:
            Path: /profile/me
            Method: put
        # === THÊM MỚI ROUTE LẤY PRESIGNED URL ===
        GetAvatarUploadUrl:
          Type: Api
          Properties:
            Path: /profile/avatar-upload-url
            Method: get
            
  EventManagementUserAvatarsBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Bạn có thể đổi tên bucket tùy ý, hoặc để AWS tự sinh chuỗi random chống trùng lặp
      BucketName: !Sub "event-management-user-avatars-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - PUT      # Bắt buộc phải có PUT để FE upload trực tiếp qua Presigned URL
              - GET
            AllowedOrigins:
              - '*'      # Khi lên production, nên giới hạn lại domain cụ thể của FE
            MaxAge: 3000
