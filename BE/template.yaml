AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS Event Management Local API



Parameters:
  CognitoUserPoolIdParam:
    Type: String
    Description: "ID của Cognito User Pool"
    Default: "YOUR_COGNITO_USER_POOL_ID_PLACEHOLDER" 
# ============================================
# Globals block với Cognito Authorizer
# Áp dụng cho TẤT CẢ API trong template này
# ============================================
Globals:
  Api:
    # ============================================
    # CORS config để xử lý preflight OPTIONS request
    # Bắt buộc phải có khi FE (localhost:5173 hoặc domain khác)
    # gọi API Gateway ở domain execute-api.amazonaws.com
    # ============================================
    Cors:
      AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"
      # Khi đã có domain FE thật (deploy lên Vercel/Amplify...),
      # nên đổi '*' thành domain cụ thể để bảo mật hơn, ví dụ:
      # AllowOrigin: "'https://your-fe-domain.com'"
    Auth:
      DefaultAuthorizer: CognitoAuthorizer
      AddDefaultAuthorizerToCorsPreflight: false
      Authorizers:
        CognitoAuthorizer:
          UserPoolArn: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolIdParam}"
         
Resources:
  EventFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: EventLambda
      CodeUri: src/Functions/EventManagement.EventLambda/
      Handler: EventManagement.EventLambda::EventManagement.EventLambda.Function::FunctionHandler
      Runtime: dotnet8
      MemorySize: 256
      Timeout: 30

      Environment:
        Variables:
          EVENT_TABLE_NAME: !Ref EventManagementEventsTable
          CATEGORY_TABLE_NAME: !Ref EventManagementCategoriesTable
          BANNER_BUCKET_NAME: !Ref EventManagementEventBannersBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventManagementEventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventManagementCategoriesTable
        - S3CrudPolicy:
            BucketName: !Ref EventManagementEventBannersBucket

      Events:
        GetEvents:
          Type: Api
          Properties:
            Path: /events
            Method: get
            Auth:
              Authorizer: NONE

        GetEventById:
          Type: Api
          Properties:
            Path: /events/{eventId}
            Method: get
            Auth:
              Authorizer: NONE

        CreateEvent:
          Type: Api
          Properties:
            Path: /admin/events
            Method: post

        GetAdminEvents:
          Type: Api
          Properties:
            Path: /admin/events
            Method: get

        GetEventBannerUploadUrl:
          Type: Api
          Properties:
            Path: /admin/events/banner-upload-url
            Method: get

        GetAdminEventById:
          Type: Api
          Properties:
            Path: /admin/events/{eventId}
            Method: get

        UpdateEvent:
          Type: Api
          Properties:
            Path: /admin/events/{eventId}
            Method: put

        PatchEventVisibility:
          Type: Api
          Properties:
            Path: /admin/events/{eventId}/visibility
            Method: patch

        GetCategories:
          Type: Api
          Properties:
            Path: /categories
            Method: get
            Auth:
              Authorizer: NONE

        GetAdminCategories:
          Type: Api
          Properties:
            Path: /admin/categories
            Method: get

        CreateCategory:
          Type: Api
          Properties:
            Path: /admin/categories
            Method: post

        UpdateCategory:
          Type: Api
          Properties:
            Path: /admin/categories/{categoryId}
            Method: put

        PatchCategory:
          Type: Api
          Properties:
            Path: /admin/categories/{categoryId}
            Method: patch

        DeleteCategory:
          Type: Api
          Properties:
            Path: /admin/categories/{categoryId}
            Method: delete

  UserProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: UserProfileLambda
      CodeUri: src/Functions/EventManagement.UserProfileLambda/
      Handler: EventManagement.UserProfileLambda::EventManagement.UserProfileLambda.Function::FunctionHandler
      Runtime: dotnet8
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          USER_TABLE_NAME: !Ref EventManagementUsersTable
          AVATAR_BUCKET_NAME: !Ref EventManagementUserAvatarsBucket

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventManagementUsersTable

        - S3CrudPolicy:
            BucketName: !Ref EventManagementUserAvatarsBucket

      Events:
        InitProfile:
          Type: Api
          Properties:
            Path: /profile/init
            Method: post
            # Tự dùng CognitoAuthorizer từ Globals - bắt buộc phải có JWT hợp lệ
        GetProfile:
          Type: Api
          Properties:
            Path: /profile/me
            Method: get
        # Tự dùng CognitoAuthorizer từ Globals - bắt buộc phải có JWT hợp lệ
        UpdateProfile:
          Type: Api
          Properties:
            Path: /profile/me
            Method: put
        # ROUTE LẤY PRESIGNED URL ===
        GetAvatarUploadUrl:
          Type: Api
          Properties:
            Path: /profile/avatar-upload-url
            Method: get

        GetAdminUsers:
          Type: Api
          Properties:
            Path: /admin/users
            Method: get

        UpdateAdminUserStatus:
          Type: Api
          Properties:
            Path: /admin/users/{userId}
            Method: patch

  TicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TicketLambda
      CodeUri: src/Functions/EventManagement.RegistrationTicketLambda/
      Handler: EventManagement.RegistrationTicketLambda::EventManagement.RegistrationTicketLambda.Function::FunctionHandler
      Runtime: dotnet8
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          # Đút tên 2 bảng từ tầng hạ tầng vào biến môi trường để file Function.cs đọc ra nhé
          TICKET_TABLE_NAME: !Ref EventManagementTicketsTable
          EVENT_TABLE_NAME: !Ref EventManagementEventsTable
          USER_TABLE_NAME: !Ref EventManagementUsersTable
          NOTIFICATION_FUNCTION_NAME: "notification-lambda"
      Policies:
        # CẤP QUYỀN ĐỒNG THỜI CHO CẢ 2 BẢNG 
        - DynamoDBCrudPolicy:
            TableName: !Ref EventManagementEventsTable   # Để đọc thông tin Event và tăng số lượng vé nguyên tử
        - DynamoDBCrudPolicy:
            TableName: !Ref EventManagementTicketsTable  # Để tạo vé mới và Query tìm vé theo UserId
        # - Statement:
        #     - Effect: Allow
        #       Action:
        #         - lambda:InvokeFunction
        #       Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:notification-lambda"
        - DynamoDBReadPolicy:
            TableName: !Ref EventManagementUsersTable
        # - Statement:
        #       - Effect: Allow
        #         Action:
        #           - dynamodb:GetItem
        #           - dynamodb:Query
        #           - dynamodb:Scan
        #         # AWS tự động hiểu và dịch chuỗi này thành ARN chuẩn khi deploy, bảo mật tuyệt đối!
        #         Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/EventManagementUsers"
        # Quyền publish sự kiện TicketRegistered lên EventBridge, để NotificationFunction lắng nghe và gửi email
        - Statement:
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"
      Events:
        RegisterTicket:
          Type: Api
          Properties:
            Path: /events/{eventId}/register
            Method: post
        GetMyTickets:
          Type: Api
          Properties:
            Path: /my-tickets
            Method: get

  AttendanceCertificateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: AttendanceCertificateLambda
      CodeUri: src/Functions/EventManagement.AttendanceCertificateLambda/
      Handler: EventManagement.AttendanceCertificateLambda::EventManagement.AttendanceCertificateLambda.Function::FunctionHandler
      Runtime: dotnet8
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          SES_FROM_EMAIL: khacanh204@gmail.com
          TICKET_TABLE_NAME: !Ref EventManagementTicketsTable
          ATTENDANCE_TABLE_NAME: !Ref EventManagementAttendanceTable
          CERTIFICATE_BUCKET_NAME: !Ref EventManagementCertificatesBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventManagementTicketsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventManagementAttendanceTable
        - S3CrudPolicy:
            BucketName: !Ref EventManagementCertificatesBucket
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
                - sesv2:SendEmail
              Resource: "*"
      Events:
        CheckInTicket:
          Type: Api
          Properties:
            Path: /tickets/checkin
            Method: post
            Auth:
              Authorizer: NONE
        GetTicketById:
          Type: Api
          Properties:
            Path: /tickets/{ticketId}
            Method: get
            Auth:
              Authorizer: NONE
        GetCertificatev2:
          Type: Api
          Properties:
            Path: /certificates-v2/{ticketId}
            Method: get
            Auth:
              Authorizer: NONE
        GetEventAttendees:
          Type: Api
          Properties:
            Path: /admin/events/{eventId}/attendees
            Method: get
            # Uses default CognitoAuthorizer from Globals — admin must be authenticated
            
  EventManagementUserAvatarsBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Bạn có thể đổi tên bucket tùy ý, hoặc để AWS tự sinh chuỗi random chống trùng lặp
      BucketName: !Sub "event-management-user-avatars-${AWS::Region}-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - PUT      # Bắt buộc phải có PUT để FE upload trực tiếp qua Presigned URL
              - GET
            AllowedOrigins:
              - '*'      # Khi lên production, nên giới hạn lại domain cụ thể của FE
            MaxAge: 3000

  EventManagementEventBannersBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Không đặt BucketName cố định — tránh xung đột với bucket orphan
      # tạo ngoài stack (lỗi AWS::EarlyValidation::ResourceExistenceCheck)
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - PUT
              - GET
            AllowedOrigins:
              - '*'
            MaxAge: 3000

  EventManagementEventBannersBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EventManagementEventBannersBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadEventBanners
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${EventManagementEventBannersBucket.Arn}/banners/*'

  EventManagementEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EventManagementEvents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: EventId
          AttributeType: S # Kiểu String
      KeySchema:
        - AttributeName: EventId
          KeyType: HASH # Khóa chính (Partition Key)

  EventManagementCategoriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EventManagementCategories
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: CategoryId
          AttributeType: S
      KeySchema:
        - AttributeName: CategoryId
          KeyType: HASH

  EventManagementAttendanceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EventManagementAttendance
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: EventId
          AttributeType: S
        - AttributeName: TicketId
          AttributeType: S
      KeySchema:
        - AttributeName: EventId
          KeyType: HASH
        - AttributeName: TicketId
          KeyType: RANGE

  EventManagementCertificatesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "event-management-certificates-${AWS::AccountId}-${AWS::Region}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
            AllowedOrigins:
              - '*'
            MaxAge: 3000

  EventManagementTicketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EventManagementTickets
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: TicketId
          AttributeType: S
        - AttributeName: UserId
          AttributeType: S
        - AttributeName: EventId
          AttributeType: S

      KeySchema:
        - AttributeName: TicketId
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: UserTicketsIndex
          KeySchema:
            - AttributeName: UserId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

        - IndexName: EventTicketsIndex
          KeySchema:
            - AttributeName: EventId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  EventManagementUsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EventManagementUsers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: UserId
          AttributeType: S
      KeySchema:
        - AttributeName: UserId
          KeyType: HASH

  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: NotificationLambda
      CodeUri: src/Functions/EventManagement.NotificationLambda/
      Handler: EventManagement.NotificationLambda::EventManagement.NotificationLambda.Function::FunctionHandler
      Runtime: dotnet8
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          SES_FROM_EMAIL: khacanh204@gmail.com
          NOTIFICATION_LOG_TABLE_NAME: !Ref EventManagementNotificationLogTable
          EVENT_TABLE_NAME: !Ref EventManagementEventsTable
          TICKET_TABLE_NAME: !Ref EventManagementTicketsTable
          USER_TABLE_NAME: !Ref EventManagementUsersTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventManagementNotificationLogTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventManagementEventsTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventManagementTicketsTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventManagementUsersTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        GetNotificationLogs:
          Type: Api
          Properties:
            Path: /admin/notifications
            Method: get
        OnTicketRegistered:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: ["eventmanagement.ticket"]
              detail-type: ["TicketRegistered"]
        EventReminderSchedule:
          Type: Schedule
          Properties:
            Schedule: "rate(1 hour)"
            Name: EventReminderSchedule
            Description: "Quét sự kiện sắp diễn ra và gửi email nhắc"

  AnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: AnalyticsLambda
      CodeUri: src/Functions/EventManagement.AnalyticsLambda/
      Handler: EventManagement.AnalyticsLambda::EventManagement.AnalyticsLambda.Function::FunctionHandler
      Runtime: dotnet8
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          EVENT_TABLE_NAME: !Ref EventManagementEventsTable
          TICKET_TABLE_NAME: !Ref EventManagementTicketsTable
          ATTENDANCE_TABLE_NAME: !Ref EventManagementAttendanceTable
          USER_TABLE_NAME: !Ref EventManagementUsersTable
          NOTIFICATION_LOG_TABLE_NAME: !Ref EventManagementNotificationLogTable
          CERTIFICATE_BUCKET_NAME: !Ref EventManagementCertificatesBucket
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventManagementEventsTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventManagementTicketsTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventManagementAttendanceTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventManagementUsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventManagementNotificationLogTable
        - S3ReadPolicy:
            BucketName: !Ref EventManagementCertificatesBucket
      Events:
        GetDashboardSummary:
          Type: Api
          Properties:
            Path: /admin/analytics/dashboard
            Method: get
        GetEventAnalytics:
          Type: Api
          Properties:
            Path: /admin/analytics/events/{eventId}
            Method: get

  EventManagementNotificationLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EventManagementNotificationLog
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: LogId
          AttributeType: S
      KeySchema:
        - AttributeName: LogId
          KeyType: HASH

  # ============================================
  # FRONTEND: S3 (lưu file build) + CloudFront (phục vụ HTTPS, cache, routing SPA)
  # ============================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "event-management-frontend-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # OAC: cơ chế bảo mật hiện đại, thay cho cách cũ (Origin Access Identity)
  # để CloudFront đọc được S3 mà không cần bucket public
  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized (AWS built-in)
          Compress: true
        # Quan trọng cho React Router: mọi path không tìm thấy file thật trên S3 (403/404)
        # đều trả về index.html để React Router tự xử lý routing phía client
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

Outputs:
  FrontendCloudFrontDomain:
    Description: "Domain CloudFront để truy cập Frontend (dùng domain này, không dùng URL S3 trực tiếp)"
    Value: !GetAtt FrontendDistribution.DomainName
  FrontendBucketName:
    Description: "Tên S3 Bucket chứa file build Frontend, dùng để upload qua aws s3 sync"
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Description: "CloudFront Distribution ID, dùng để tạo cache invalidation sau mỗi lần deploy"
    Value: !Ref FrontendDistribution